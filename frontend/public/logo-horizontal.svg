<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 240" width="100%" height="100%">
  <defs>
    <!-- Background Space Radial -->
    <radialGradient id="spaceBgH" cx="20%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0c172e" />
      <stop offset="60%" stop-color="#050a14" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>

    <!-- Mars Gradient -->
    <linearGradient id="marsGradH" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#ff7a18" />
      <stop offset="40%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#7c1a1a" />
    </linearGradient>

    <!-- Bio-Nutrition Sprout Gradient -->
    <linearGradient id="leafGradH" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Health Pulse / Orbital Cyan Gradient -->
    <linearGradient id="orbitGradH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glowH" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Icon Emblem (Scale & Position) -->
  <g transform="translate(18, 16)">
    <!-- Container Badge -->
    <rect width="208" height="208" rx="48" fill="url(#spaceBgH)" stroke="rgba(255,255,255,0.12)" stroke-width="2" />
    <rect x="4" y="4" width="200" height="200" rx="44" fill="none" stroke="rgba(56,189,248,0.22)" stroke-width="1.2" />

    <!-- Mars Sphere -->
    <g transform="translate(104, 104)">
      <circle r="58" fill="url(#marsGradH)" />
      <path d="M 0 -58 A 58 58 0 0 1 0 58 A 58 58 0 0 0 0 -58" fill="#030712" opacity="0.55" />

      <!-- Orbit Ring -->
      <path d="M -72 15 C -65 -45 45 -70 75 -20 C 85 25 -25 75 -65 45" fill="none" stroke="url(#orbitGradH)" stroke-width="2.6" opacity="0.8" />
      
      <!-- ECG Pulse on orbit -->
      <path d="M -75 10 L -45 10 L -38 -2 L -30 22 L -20 -15 L -12 10 L 15 10" fill="none" stroke="#38bdf8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Bio Sprout -->
      <path d="M 0 24 C -22 6 -26 -16 0 -32 C -6 -6 -3 10 0 24 Z" fill="url(#leafGradH)" filter="url(#glowH)" />
      <path d="M 0 24 C 22 10 26 -10 8 -26 C 6 -6 3 10 0 24 Z" fill="url(#leafGradH)" opacity="0.9" />
      <path d="M 0 24 Q -2 4 0 -32" fill="none" stroke="#d1fae5" stroke-width="1.6" stroke-linecap="round" />
      <circle cx="0" cy="-35" r="3.2" fill="#38bdf8" filter="url(#glowH)" />
      <circle cx="0" cy="-35" r="1.5" fill="#ffffff" />
    </g>
  </g>

  <!-- Right Typography Section -->
  <g transform="translate(254, 42)">
    <!-- Category Badge -->
    <rect x="0" y="4" width="248" height="26" rx="13" fill="rgba(6,182,212,0.12)" stroke="rgba(6,182,212,0.3)" />
    <text x="12" y="21" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.5" fill="#22d3ee">
      ● NASA SPACE APPS 2026
    </text>

    <!-- Main Title -->
    <text x="0" y="78" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="46" font-weight="900" letter-spacing="2" fill="#ffffff">
      NURTURE<tspan fill="#ff7a18">AI</tspan><tspan fill="#38bdf8">SPACE</tspan>
    </text>

    <!-- Primary Subtitle -->
    <text x="2" y="112" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700" letter-spacing="2" fill="#38bdf8">
      ASTRONAUT HEALTH &amp; BIO-NUTRITION INTELLIGENCE
    </text>

    <!-- Feature Description -->
    <text x="2" y="136" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="500" fill="#94a3b8">
      Personal-Baseline Health Monitoring • Storage Vitamin Decay Kinetics • What-To-Eat Guidance
    </text>
  </g>
</svg>
